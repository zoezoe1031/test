<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>☀️ 여름날의 독서토론 기록장 📚</title>

<!-- Fonts: 헤딩(Gowun Batang, 부드러운 명조) + 본문(Gaegu, 동글동글 손글씨체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --sky:#BEE3F4; --sky-deep:#6FB8DE;
    --green:#BFE3C9; --green-deep:#6FAE83;
    --sand:#F3E3B9; --sand-deep:#E0BE7A;
    --coral:#FF9B85; --coral-deep:#F1785E;
    --ink:#3E3A34; --ink-soft:#8A8175;
    --bg:#FBF8F0;
  }
  html,body{ background:var(--bg); font-family:'Gaegu', sans-serif; color:var(--ink); }
  .font-head{ font-family:'Gowun Batang', serif; }
  .font-cute{ font-family:'Jua', 'Gaegu', sans-serif; letter-spacing:.01em; }
  .title-bold{
    color:#2C2721;
    text-shadow: 0.7px 0 currentColor, -0.7px 0 currentColor, 0 0.7px currentColor, 0 -0.3px currentColor;
  }
  ::selection{ background:var(--coral); color:white; }

  /* 부드러운 물결 배경 텍스처 */
  .wave-bg{
    background-image: radial-gradient(circle at 10% 20%, rgba(190,227,244,0.5) 0, transparent 45%),
                       radial-gradient(circle at 90% 10%, rgba(243,227,185,0.5) 0, transparent 40%),
                       radial-gradient(circle at 80% 90%, rgba(191,227,201,0.45) 0, transparent 45%);
  }

  .cute-card{
    background:#fff;
    border-radius:28px;
    border:2px solid rgba(62,58,52,0.08);
    box-shadow: 0 10px 0 rgba(62,58,52,0.05), 0 18px 40px -20px rgba(62,58,52,0.25);
  }

  .bookmark-tab{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 22px 12px 20px;
    border-radius:18px 18px 4px 4px;
    font-family:'Gowun Batang', serif;
    font-weight:700;
    color:#fff;
    box-shadow: 0 6px 14px -6px rgba(0,0,0,0.35);
    transform: translateY(2px);
  }
  .bookmark-tab::after{
    content:"";
    position:absolute;
    left:50%; bottom:-9px; transform:translateX(-50%);
    width:0; height:0;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-top:9px solid currentColor;
  }

  .field-label{ font-family:'Gowun Batang', serif; font-weight:700; color:var(--ink); }

  input[type=text], textarea{
    font-family:'Gaegu', sans-serif;
    font-size:1.02rem;
    background:#FFFDF8;
    border:2px solid #EFE7D6;
    border-radius:16px;
    padding:10px 14px;
    width:100%;
    transition:border-color .15s, box-shadow .15s;
    color:var(--ink);
  }
  input[type=text]:focus, textarea:focus{
    outline:none;
    border-color:var(--sky-deep);
    box-shadow: 0 0 0 4px rgba(111,184,222,0.18);
  }
  input.err, textarea.err{
    border-color:var(--coral-deep) !important;
    box-shadow: 0 0 0 4px rgba(241,120,94,0.15) !important;
  }

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--sand); color:var(--ink);
    border-radius:999px; padding:5px 12px 5px 14px;
    font-weight:700; font-size:.92rem;
    border:1px solid var(--sand-deep);
  }
  .chip button{ line-height:1; opacity:.6; }
  .chip button:hover{ opacity:1; }

  .cta-btn{
    background: linear-gradient(180deg, var(--coral) 0%, var(--coral-deep) 100%);
    box-shadow: 0 8px 0 #C85C45, 0 16px 30px -10px rgba(200,92,69,0.5);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .cta-btn:active{ transform: translateY(6px); box-shadow: 0 2px 0 #C85C45, 0 8px 16px -8px rgba(200,92,69,0.5); }
  .cta-btn:disabled{ opacity:.6; cursor:not-allowed; }

  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-10px) rotate(var(--r,0deg)); } }
  .floaty{ animation: floaty 5s ease-in-out infinite; }

  @keyframes pop-in{ from{ opacity:0; transform:scale(.9) translateY(10px);} to{ opacity:1; transform:scale(1) translateY(0);} }
  .pop-in{ animation: pop-in .25s ease-out; }

  @media (prefers-reduced-motion: reduce){
    .floaty{ animation:none; }
  }
</style>
</head>
<body class="wave-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

/* ---------------- 아이콘 (동글동글 라인 스타일) ---------------- */
const IconBase = ({ children, className, viewBox="0 0 24 24" }) => (
  <svg viewBox={viewBox} className={className} fill="none" stroke="currentColor"
       strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const SunIcon = (p) => (
  <IconBase {...p}>
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/>
  </IconBase>
);
const WatermelonIcon = (p) => (
  <IconBase {...p}>
    <path d="M3 12a9 9 0 0 0 18 0c0-5-5-8-9-9.5C7.5 4 3 7 3 12Z"/>
    <path d="M3 12a9 9 0 0 0 18 0" strokeDasharray="0"/>
    <path d="M6 12a6 6 0 0 0 12 0"/>
    <circle cx="10" cy="12.8" r=".55" fill="currentColor" stroke="none"/>
    <circle cx="14.3" cy="12.5" r=".55" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="15.5" r=".55" fill="currentColor" stroke="none"/>
  </IconBase>
);
const LeafIcon = (p) => (
  <IconBase {...p}>
    <path d="M4 20c8-1 13-6 15-15-9 1-14 6-15 15Z"/>
    <path d="M6 18c3-4 6-7 12-11"/>
  </IconBase>
);
const BookIcon = (p) => (
  <IconBase {...p}>
    <path d="M4 5.2c2.2-1.1 5-1.1 7 0v13.6c-2-1.1-4.8-1.1-7 0V5.2Z"/>
    <path d="M20 5.2c-2.2-1.1-5-1.1-7 0v13.6c2-1.1 4.8-1.1 7 0V5.2Z"/>
  </IconBase>
);
const PencilIcon = (p) => (
  <IconBase {...p}>
    <path d="M14.3 4.8 19 9.5 8.2 20.3 3.6 21l.6-4.6L14.3 4.8Z"/>
    <path d="M12.6 6.5 17.3 11.2"/>
  </IconBase>
);
const PalmIcon = (p) => (
  <IconBase {...p}>
    <path d="M12 21V11"/>
    <path d="M12 11c-2-3-6-3-8-1 3 1 4 2 5 3.5"/>
    <path d="M12 11c2-3 6-3 8-1-3 1-4 2-5 3.5"/>
    <path d="M12 11c-1-3 0-6 2.5-8"/>
    <path d="M12 11c1-3 0-6-2.5-8"/>
  </IconBase>
);
const DropletIcon = (p) => (
  <IconBase {...p}>
    <path d="M12 3c3.5 4.2 6 7.6 6 10.7A6 6 0 1 1 6 13.7C6 10.6 8.5 7.2 12 3Z"/>
  </IconBase>
);
const TagIconSmall = (p) => (
  <IconBase {...p}>
    <path d="M11 4h5.5L20 7.5V13l-9 9-9-9 9-9Z"/>
    <circle cx="14.5" cy="8.5" r="1"/>
  </IconBase>
);

/* ---------------- 작은 UI 부품 ---------------- */
const Field = ({ label, required, hint, children }) => (
  <div className="mb-5">
    <label className="field-label text-[1.02rem] flex items-baseline gap-1 mb-1.5">
      {label}{required && <span style={{color:'var(--coral-deep)'}}>*</span>}
    </label>
    {hint && <p className="text-sm mb-1.5" style={{color:'var(--ink-soft)'}}>{hint}</p>}
    {children}
  </div>
);

const TextInput = ({ value, onChange, placeholder, error }) => (
  <input type="text" className={error ? "err" : ""} value={value}
         onChange={e => onChange(e.target.value)} placeholder={placeholder} />
);

const TextArea = ({ value, onChange, placeholder, rows=3, error }) => (
  <textarea className={error ? "err" : ""} rows={rows} value={value}
            onChange={e => onChange(e.target.value)} placeholder={placeholder} />
);

const SectionTab = ({ color, colorDeep, icon, label }) => (
  <div className="bookmark-tab -mb-1" style={{ background: color, color: colorDeep }}>
    <span style={{color:'#fff'}}>{icon}</span>
    <span style={{color:'#fff'}}>{label}</span>
  </div>
);

const StageCard = ({ tabColor, tabColorDeep, icon, tabLabel, title, subtitle, children }) => (
  <section className="mb-10">
    <div style={{ color: tabColorDeep }}>
      <div className="bookmark-tab" style={{ background: tabColor }}>
        <span className="text-white w-5 h-5">{icon}</span>
        <span className="text-white">{tabLabel}</span>
      </div>
    </div>
    <div className="cute-card p-6 sm:p-8 pt-8">
      <h2 className="font-cute text-xl sm:text-2xl mb-1" style={{color: tabColorDeep}}>{title}</h2>
      {subtitle && <p className="text-sm mb-6" style={{color:'var(--ink-soft)'}}>{subtitle}</p>}
      {children}
    </div>
  </section>
);

const SubBlock = ({ number, title, color, children }) => (
  <div className="mb-8 last:mb-0">
    <div className="flex items-center gap-2 mb-4">
      <span className="w-7 h-7 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0"
            style={{ background: color }}>{number}</span>
      <h3 className="font-cute text-lg" style={{color:'var(--ink)'}}>{title}</h3>
    </div>
    <div className="pl-0 sm:pl-9">{children}</div>
  </div>
);

/* ---------------- 태그(핵심 단어) 입력 ---------------- */
function TagInput({ tags, setTags, error }){
  const [draft, setDraft] = useState("");
  const add = () => {
    const v = draft.trim();
    if(!v) return;
    if(!tags.includes(v)) setTags([...tags, v]);
    setDraft("");
  };
  return (
    <div>
      <div className="flex gap-2">
        <input type="text" className={error ? "err" : ""} value={draft}
               placeholder="핵심 단어를 입력하고 Enter ↵"
               onChange={e=>setDraft(e.target.value)}
               onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }} />
        <button type="button" onClick={add}
                className="shrink-0 px-4 rounded-2xl font-head font-bold text-white"
                style={{background:'var(--green-deep)'}}>+ 추가</button>
      </div>
      {tags.length>0 &&
        <div className="flex flex-wrap gap-2 mt-3">
          {tags.map((t,i)=>(
            <span key={i} className="chip">
              <TagIconSmall className="w-3.5 h-3.5" />
              {t}
              <button type="button" onClick={()=>setTags(tags.filter((_,idx)=>idx!==i))}>✕</button>
            </span>
          ))}
        </div>
      }
    </div>
  );
}

/* ---------------- 메인 앱 ---------------- */

// ⚠️ 선생님용 설정: 구글 앱스 스크립트(Google Apps Script) 웹앱 배포 URL을 아래에 넣어주세요.
// Google Sheets 확장 프로그램 > Apps Script 에서 doPost(e) 함수를 작성하고
// "배포 > 웹 앱으로 배포"한 뒤 생성되는 URL을 여기에 붙여넣으면 됩니다.
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz7YaJVTc9g3I7IphBNYwfVVlZdleC9Xrh6JiFadn9ZCwRs2z1354HFU2UkD6WbL0yRcQ/exec";

async function sendToGoogleSheet(payload){
  // Apps Script 웹앱은 보통 CORS 응답 헤더를 주지 않기 때문에 no-cors 모드로 전송합니다.
  // no-cors 모드에서는 응답 내용을 읽을 수 없어, 네트워크 예외가 없으면 전송 성공으로 간주합니다.
  await fetch(WEBHOOK_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

function App(){
  const [studentId, setStudentId] = useState("");
  const [name, setName] = useState("");
  const [group, setGroup] = useState("");

  const [bookTitle, setBookTitle] = useState("");
  const [author, setAuthor] = useState("");
  const [reason, setReason] = useState("");

  const [background, setBackground] = useState("");
  const [impressive, setImpressive] = useState("");
  const [opinion, setOpinion] = useState("");
  const [tags, setTags] = useState([]);

  const [question, setQuestion] = useState("");
  const [questions, setQuestions] = useState(["", "", "", "", ""]);

  const [finalTopic, setFinalTopic] = useState("");
  const [myArgument, setMyArgument] = useState("");
  const [peers, setPeers] = useState(["", "", "", ""]);

  const [myFinalOpinion, setMyFinalOpinion] = useState("");
  const [learned, setLearned] = useState("");
  const [curious, setCurious] = useState("");
  const [feeling, setFeeling] = useState("");

  const [errors, setErrors] = useState({});
  const [sending, setSending] = useState(false);
  const [showSuccess, setShowSuccess] = useState(false);
  const [showFail, setShowFail] = useState(false);
  const topRef = useRef(null);

  const requiredFields = [
    ["studentId", studentId], ["name", name], ["group", group],
    ["bookTitle", bookTitle], ["author", author], ["reason", reason],
    ["finalTopic", finalTopic], ["myArgument", myArgument],
    ["myFinalOpinion", myFinalOpinion], ["feeling", feeling],
  ];

  const validate = () => {
    const newErr = {};
    requiredFields.forEach(([key, val]) => { if(!val.trim()) newErr[key] = true; });
    setErrors(newErr);
    return Object.keys(newErr).length === 0;
  };

  const handleSubmit = async () => {
    if(!validate()){
      topRef.current?.scrollIntoView({ behavior:"smooth", block:"start" });
      return;
    }
    setSending(true);
    const payload = {
      제출시각: new Date().toISOString(),
      학번: studentId, 이름: name, 주제: group,
      도서명: bookTitle, 작가: author, 책선정이유: reason,
      사전배경지식: background, 인상적인부분: impressive, 나의의견평가: opinion, 핵심단어: tags,
      토론하고싶은내용: question, 질문목록: questions,
      최종토론주제: finalTopic, 내가제시한의견: myArgument, 모둠원의견: peers,
      내의견정리: myFinalOpinion, 배운점: learned, 더알아보고싶은점: curious, 활동소감: feeling,
    };
    try{
      await sendToGoogleSheet(payload);
      setShowSuccess(true);
    }catch(err){
      console.error(err);
      setShowFail(true);
    }finally{
      setSending(false);
    }
  };

  const setQ = (i, v) => setQuestions(qs => qs.map((q,idx)=> idx===i? v : q));
  const setPeer = (i, v) => setPeers(ps => ps.map((p,idx)=> idx===i? v : p));

  return (
    <div ref={topRef} className="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

      {/* 헤더 */}
      <header className="relative text-center mb-12 pt-4">
        <SunIcon className="w-10 h-10 absolute -top-2 left-2 sm:left-8 floaty" style={{color:'var(--sand-deep)', '--r':'-8deg'}} />
        <WatermelonIcon className="w-9 h-9 absolute top-6 right-2 sm:right-10 floaty" style={{color:'var(--coral-deep)', animationDelay:'1s', '--r':'6deg'}} />
        <LeafIcon className="w-8 h-8 absolute -bottom-2 left-8 sm:left-20 floaty" style={{color:'var(--green-deep)', animationDelay:'2s'}} />
        <p className="tracking-[0.3em] text-sm font-bold mb-2" style={{color:'var(--sky-deep)'}}>SUMMER &amp; BOOKS · 가온누리 독서토론 활동지</p>
        <h1 className="font-head title-bold text-3xl sm:text-4xl font-bold leading-snug">☀️ 여름날의 독서토론 기록장 📚</h1>
        <p className="mt-3 text-base" style={{color:'var(--ink-soft)'}}>책 한 권과 함께, 시원한 생각을 나눠볼까요?</p>
      </header>

      {/* 학생 정보 */}
      <section className="cute-card p-6 sm:p-8 mb-10">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
          <Field label="학번" required>
            <TextInput value={studentId} onChange={setStudentId} placeholder="예: 20315" error={errors.studentId}/>
          </Field>
          <Field label="이름" required>
            <TextInput value={name} onChange={setName} placeholder="예: 김도담" error={errors.name}/>
          </Field>
          <Field label="주제" required>
            <TextInput value={group} onChange={setGroup} placeholder="예: 인문, 경영" error={errors.group}/>
          </Field>
        </div>
      </section>

      {/* 1. 독서토론 전 */}
      <StageCard tabColor="var(--sky-deep)" tabColorDeep="var(--sky-deep)"
                 icon={<BookIcon className="w-full h-full"/>} tabLabel="독서토론 전"
                 title="🌊 책과 만나는 시간" subtitle="함께 읽을 책을 정하고, 메모하며 읽어봐요.">
        <SubBlock number="①" title="도서 정보" color="var(--sky-deep)">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <Field label="도서명 (작가)" required>
              <TextInput value={bookTitle} onChange={setBookTitle} placeholder="예: 아몬드" error={errors.bookTitle}/>
            </Field>
            <Field label="작가" required>
              <TextInput value={author} onChange={setAuthor} placeholder="예: 손원평" error={errors.author}/>
            </Field>
          </div>
          <Field label="책 선정 이유" required>
            <TextArea value={reason} onChange={setReason} placeholder="이 책을 고른 이유를 자유롭게 적어보세요." error={errors.reason}/>
          </Field>
        </SubBlock>

        <SubBlock number="②" title="메모하며 독서하기" color="var(--sky-deep)">
          <Field label="사전 배경지식">
            <TextArea value={background} onChange={setBackground} rows={2} placeholder="책을 읽기 전 알고 있던 내용이나 관련 지식"/>
          </Field>
          <Field label="인상적인 부분 및 이유">
            <TextArea value={impressive} onChange={setImpressive} placeholder="가장 인상 깊었던 장면·문장과 그 이유"/>
          </Field>
          <Field label="인물·사회·사건 등에 대한 나의 의견 또는 평가">
            <TextArea value={opinion} onChange={setOpinion} placeholder="등장인물의 행동, 사회적 배경, 사건에 대한 나의 생각"/>
          </Field>
          <Field label="핵심 단어 선별" hint="단어를 입력하고 Enter를 누르면 태그로 추가돼요.">
            <TagInput tags={tags} setTags={setTags} />
          </Field>
        </SubBlock>
      </StageCard>

      {/* 2. 독서토론 중 */}
      <StageCard tabColor="var(--green-deep)" tabColorDeep="var(--green-deep)"
                 icon={<DropletIcon className="w-full h-full"/>} tabLabel="독서토론 중"
                 title="🍉 생각을 나누는 시간" subtitle="궁금했던 점을 질문으로 만들고, 모둠원과 토론해요.">
        <SubBlock number="①" title="토론 주제 정하기" color="var(--green-deep)">
          <Field label="책을 읽은 후 의문점 & 토론하고 싶은 내용">
            <TextArea value={question} onChange={setQuestion} placeholder="책을 읽으며 생긴 궁금증이나 더 이야기해보고 싶은 주제"/>
          </Field>
          <Field label="질문 만들기">
            <div className="space-y-2.5">
              {questions.map((q,i)=>(
                <div key={i} className="flex items-center gap-2.5">
                  <span className="w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold shrink-0 text-white"
                        style={{background:'var(--green-deep)'}}>{i+1}</span>
                  <TextInput value={q} onChange={v=>setQ(i,v)} placeholder={`질문 ${i+1}번을 적어보세요`} />
                </div>
              ))}
            </div>
          </Field>
        </SubBlock>

        <SubBlock number="②" title="토론 내용 기록하기" color="var(--green-deep)">
          <Field label="최종 선정 토론 주제" required>
            <TextInput value={finalTopic} onChange={setFinalTopic} placeholder="모둠이 최종적으로 선택한 토론 주제" error={errors.finalTopic}/>
          </Field>
          <Field label="내가 제시한 의견 (이유 및 근거 제시)" required>
            <TextArea value={myArgument} onChange={setMyArgument} placeholder="나의 주장과 그 이유·근거를 적어보세요." error={errors.myArgument}/>
          </Field>
          <Field label="모둠원 의견">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {peers.map((p,i)=>(
                <TextArea key={i} value={p} onChange={v=>setPeer(i,v)} rows={2} placeholder={`모둠원 의견 ${i+1}`} />
              ))}
            </div>
          </Field>
        </SubBlock>
      </StageCard>

      {/* 3. 독서토론 후 */}
      <StageCard tabColor="var(--sand-deep)" tabColorDeep="var(--coral-deep)"
                 icon={<PalmIcon className="w-full h-full"/>} tabLabel="독서토론 후"
                 title="🌴 생각을 정리하는 시간" subtitle="토론을 마치고 나의 생각을 가다듬어 봐요.">
        <SubBlock number="①" title="내 의견 정리하기" color="var(--coral-deep)">
          <Field label="토론 후 나의 최종 의견" required>
            <TextArea value={myFinalOpinion} onChange={setMyFinalOpinion} placeholder="토론 전과 비교해 나의 생각이 어떻게 정리되었나요?" error={errors.myFinalOpinion}/>
          </Field>
        </SubBlock>

        <SubBlock number="②" title="활동 마무리하기" color="var(--coral-deep)">
          <Field label="독서토론을 통해 배운 점 또는 알게 된 점">
            <TextArea value={learned} onChange={setLearned} rows={2} />
          </Field>
          <Field label="더 알아보고 싶은 점">
            <TextArea value={curious} onChange={setCurious} rows={2} />
          </Field>
          <Field label="활동 소감" required>
            <TextArea value={feeling} onChange={setFeeling} placeholder="오늘의 독서토론, 어땠나요?" error={errors.feeling}/>
          </Field>
        </SubBlock>
      </StageCard>

      {/* 전송 */}
      <section className="text-center pb-4">
        {Object.keys(errors).length>0 &&
          <p className="mb-4 font-bold" style={{color:'var(--coral-deep)'}}>
            ✏️ 빨간 테두리로 표시된 필수 항목을 채워주세요!
          </p>
        }
        <button type="button" onClick={handleSubmit} disabled={sending}
                className="cta-btn font-head text-white text-xl sm:text-2xl font-bold rounded-full px-12 sm:px-16 py-4 sm:py-5">
          {sending ? "전송 중... 🌊" : "전송하기 🚀"}
        </button>
        <p className="mt-4 text-sm" style={{color:'var(--ink-soft)'}}>버튼을 누르면 선생님의 구글 시트로 기록이 전달돼요.</p>
      </section>

      {/* 성공 모달 */}
      {showSuccess &&
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{background:'rgba(62,58,52,0.45)'}}>
          <div className="pop-in cute-card p-8 max-w-sm w-full text-center">
            <div className="text-5xl mb-3">🍉</div>
            <h3 className="font-head text-xl font-bold mb-2">전송 완료!</h3>
            <p className="mb-6" style={{color:'var(--ink-soft)'}}>선생님에게 성공적으로 전달되었습니다! 🍉</p>
            <button type="button" onClick={()=>setShowSuccess(false)}
                    className="rounded-full px-8 py-2.5 font-head font-bold text-white"
                    style={{background:'var(--green-deep)'}}>확인</button>
          </div>
        </div>
      }

      {/* 실패 모달 */}
      {showFail &&
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{background:'rgba(62,58,52,0.45)'}}>
          <div className="pop-in cute-card p-8 max-w-sm w-full text-center">
            <div className="text-5xl mb-3">🌧️</div>
            <h3 className="font-head text-xl font-bold mb-2">전송에 실패했어요</h3>
            <p className="mb-6" style={{color:'var(--ink-soft)'}}>네트워크 상태를 확인하거나, 선생님께 웹훅 주소 설정을 문의해 주세요.</p>
            <button type="button" onClick={()=>setShowFail(false)}
                    className="rounded-full px-8 py-2.5 font-head font-bold text-white"
                    style={{background:'var(--coral-deep)'}}>확인</button>
          </div>
        </div>
      }

      <footer className="text-center text-sm mt-6" style={{color:'var(--ink-soft)'}}>
        📚 여름과 책 · 가온누리 독서토론 학습지
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
